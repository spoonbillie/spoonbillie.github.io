<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spoonbillie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            cursor: none;
        }
        #start {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: black;
            border: none;
            cursor: pointer;
            z-index: 10;
        }
        #start img {
            width: 250px;
            max-width: 70vw;
            height: auto;
            object-fit: contain;
            pointer-events: none;
        }
        #video {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: fill;
            background: black;
            pointer-events: none;
        }
        #video.active {
            display: block;
        }
		#logo {
            position: fixed;
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            width: 100px;
            max-width: 40vw;
            height: auto;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }
        #overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
            display: none;
        }
    </style>
</head>
<body>
    <button id="start">
        <img src="media/images/button.png" alt="Play">
    </button>
    <video
        id="video"
        src="media/videos/video.mp4"
        playsinline
        preload="auto"
        loop
        muted
        disablePictureInPicture
        controlsList="nodownload nofullscreen noremoteplayback"
    ></video>
    <audio id="sound" src="media/sounds/sound1.wav" loop preload="auto"></audio>
    <audio id="sound2" src="media/sounds/sound2.wav" loop preload="auto"></audio>
    <div id="overlay"></div>
	<img id="logo" src="media/images/logo.png" alt="Logo">

    <!-- Links to your script.js file -->
    <script src="script.js"></script>
</body>
</html>
